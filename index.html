<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <ul>
                <li>Accueil</li>
                <li>Circuits</li>
                <li>Contact</li>
                <li>A propos</li>
            </ul>
        </nav>
        <h1 class="title">Betsi Tourism Consulting</h1>
        <div class="presentation">
            <div class="carrousel">
                <p>"Avec le tourisme,<br>Ensemble,<br> Construisons nos territoires"</p>
            </div>
            <div class="login">
                <form>
                    <h1>Connexion</h1>
                    <label for="username">Email</label>
                    <input type="text" id="username" placeholder="example@gmail.com">
                    <label for="password">Mots de passe</label>
                    <input type="password" id="password" placeholder="**************" hidden>
                    <button type="submit">Se connecter</button>
                </form>
            </div>
        </div>
        <div style="height: 15vh;"></div>
    </header>


</body>

</html>
